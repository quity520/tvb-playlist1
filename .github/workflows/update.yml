name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build playlist
        run: |
          echo '#EXTM3U' > all.m3u

          for url in \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/hk.m3u" \
            "https://iptv-org.github.io/iptv/countries/hk.m3u"
          do
            curl -L --fail --max-time 30 "$url" -o temp.m3u || continue
            tail -n +2 temp.m3u >> all.m3u
            echo >> all.m3u
          done

          rm -f temp.m3u

      - name: Commit playlist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add all.m3u
          git diff --cached --quiet || git commit -m "Auto update IPTV playlist"
          git push
